misconfigurations:
  - id: DS-0002
    paths:
      - .clusterfuzzlite/Dockerfile
    statement: >-
      Образ только собирает фаззеры ClusterFuzzLite: base-builder по замыслу
      работает от root, и сборка фаззеров рассчитана на это.
secrets:
  - id: private-key
    paths:
      - internal/testdata/priv.key
    statement: >-
      Ключ тестового сертификата localhost из internal/testdata/generate_key.sh, открыт
      вместе с исходником quic-go: его CA доверяют только тесты, пример и фаззинг этого репо.
