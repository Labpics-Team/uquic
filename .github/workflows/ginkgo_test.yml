name: "Ginkgo Unit Tests"

on:
  workflow_call:

permissions:
  contents: read

# Compiler flags and user Go configuration cannot alter the native case.
env:
  GOFLAGS: ""
  GOENV: "off"
  GOTOOLCHAIN: local
  GOOS: ""
  GOARCH: ""

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # os: [ "ubuntu-latest", "windows-latest", "macos-latest" ]
        go: ["1.26.0", "1.26.x"]
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ matrix.go }}
      - run: go version

      - name: Verify Chrome QUIC handshake completion
        run: go test -count=1 -timeout 45s -run TestChrome146_DifferentialAgainstRealChrome -v .
      - name: Run unit tests
        env:
          TIMESCALE_FACTOR: 10
        run: go run github.com/onsi/ginkgo/v2/ginkgo -r -v -cover -randomize-all -randomize-suites -trace -skip-package integrationtests
