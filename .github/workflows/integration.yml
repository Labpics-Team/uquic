name: Integration

on:
  workflow_call:

permissions:
  contents: read

# Независимые группы выполняются в отдельных hosted-средах.
# Таймеры, тела тестов и параметры нагрузки остаются прежними.
# Compiler flags and user Go configuration cannot alter the native case.
env:
  GOFLAGS: ""
  GOENV: "off"
  GOTOOLCHAIN: local
  GOOS: ""
  GOARCH: ""

defaults:
  run:
    shell: bash

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "ubuntu"
            go: "1.26.0"
            race: false
            use32bit: false
            mode: "v1"
            version: 1
          - os: "ubuntu"
            go: "1.26.0"
            race: false
            use32bit: false
            mode: "v2"
            version: 2
          - os: "ubuntu"
            go: "1.26.0"
            race: false
            use32bit: false
            mode: "gso"
            version: 1
          - os: "ubuntu"
            go: "1.26.0"
            race: false
            use32bit: false
            mode: "ecn"
            version: 1
          - os: "ubuntu"
            go: "1.26.x"
            race: false
            use32bit: false
            mode: "v1"
            version: 1
          - os: "ubuntu"
            go: "1.26.x"
            race: false
            use32bit: false
            mode: "v2"
            version: 2
          - os: "ubuntu"
            go: "1.26.x"
            race: false
            use32bit: false
            mode: "gso"
            version: 1
          - os: "ubuntu"
            go: "1.26.x"
            race: false
            use32bit: false
            mode: "ecn"
            version: 1
          - os: "ubuntu"
            go: "1.26.x"
            race: true
            use32bit: false
            mode: "v1"
            version: 1
          - os: "ubuntu"
            go: "1.26.x"
            race: true
            use32bit: false
            mode: "gso"
            version: 1
          - os: "ubuntu"
            go: "1.26.x"
            race: false
            use32bit: true
            mode: "v1"
            version: 1
          - os: "ubuntu"
            go: "1.26.x"
            race: false
            use32bit: true
            mode: "v2"
            version: 2
          - os: "ubuntu"
            go: "1.26.x"
            race: false
            use32bit: true
            mode: "gso"
            version: 1
          - os: "ubuntu"
            go: "1.26.x"
            race: false
            use32bit: true
            mode: "ecn"
            version: 1
          - os: "windows"
            go: "1.26.x"
            race: false
            use32bit: false
            mode: "v1"
            version: 1
          - os: "windows"
            go: "1.26.x"
            race: false
            use32bit: false
            mode: "v2"
            version: 2
          - os: "macos"
            go: "1.26.x"
            race: false
            use32bit: false
            mode: "v1"
            version: 1
          - os: "macos"
            go: "1.26.x"
            race: false
            use32bit: false
            mode: "v2"
            version: 2
    runs-on: ${{ format('{0}-latest', matrix.os) }}
    timeout-minutes: 30
    env:
      DEBUG: false
      TIMESCALE_FACTOR: 3
      QUIC_CI_RACE: ${{ matrix.race }}
      QUIC_CI_32BIT: ${{ matrix.use32bit }}
      QUIC_CI_MODE: ${{ matrix.mode }}
      QUIC_CI_VERSION: ${{ matrix.version }}
    name: "Протокольные сценарии (${{ matrix.os }}, Go ${{ matrix.go }}, ${{ matrix.mode }}${{ matrix.race && ', race' || '' }}${{ matrix.use32bit && ', 32-bit' || '' }})"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ matrix.go }}
      - run: go version
      - name: Проверить протокол
        run: bash ci/run-native-tests.sh self
  ancillary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "ubuntu"
            go: "1.26.0"
            race: false
            use32bit: false
          - os: "ubuntu"
            go: "1.26.x"
            race: false
            use32bit: false
          - os: "ubuntu"
            go: "1.26.x"
            race: true
            use32bit: false
          - os: "ubuntu"
            go: "1.26.x"
            race: false
            use32bit: true
          - os: "windows"
            go: "1.26.x"
            race: false
            use32bit: false
          - os: "macos"
            go: "1.26.x"
            race: false
            use32bit: false
    runs-on: ${{ format('{0}-latest', matrix.os) }}
    timeout-minutes: 30
    env:
      DEBUG: false
      TIMESCALE_FACTOR: 3
      QUIC_CI_RACE: ${{ matrix.race }}
      QUIC_CI_32BIT: ${{ matrix.use32bit }}
    name: "Вспомогательные сценарии (${{ matrix.os }}, Go ${{ matrix.go }}${{ matrix.race && ', race' || '' }}${{ matrix.use32bit && ', 32-bit' || '' }})"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ matrix.go }}
      - run: go version
      - name: Проверить инструменты
        run: bash ci/run-native-tests.sh tools
      - name: Проверить согласование версии
        run: bash ci/run-native-tests.sh versionnegotiation
  benchmarks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "ubuntu"
            go: "1.26.0"
            race: false
            use32bit: false
          - os: "ubuntu"
            go: "1.26.x"
            race: false
            use32bit: false
          - os: "ubuntu"
            go: "1.26.x"
            race: false
            use32bit: true
          - os: "windows"
            go: "1.26.x"
            race: false
            use32bit: false
          - os: "macos"
            go: "1.26.x"
            race: false
            use32bit: false
    runs-on: ${{ format('{0}-latest', matrix.os) }}
    timeout-minutes: 30
    env:
      DEBUG: false
      TIMESCALE_FACTOR: 3
      QUIC_CI_RACE: ${{ matrix.race }}
      QUIC_CI_32BIT: ${{ matrix.use32bit }}
    name: "Производительность (${{ matrix.os }}, Go ${{ matrix.go }}${{ matrix.use32bit && ', 32-bit' || '' }})"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ matrix.go }}
      - run: go version
      - name: Измерить производительность
        run: bash ci/run-native-tests.sh benchmarks
  gate:
    name: Интеграционные проверки
    needs: [integration, ancillary, benchmarks]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Проверить все матрицы
        shell: bash
        env:
          NEEDS_RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          [[ "$NEEDS_RESULTS" =~ ^success(,success)*$ ]]
