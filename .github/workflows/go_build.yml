name: "Go Build"

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ "ubuntu-latest", "windows-latest", "macos-latest" ]
        go: [ "1.21.x", "1.22.x" ]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}
    - run: go version
    - name: Build
      run: go build -v ./...

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - run: go test -count=1 ./ci

  ginkgo:
    uses: ./.github/workflows/ginkgo_test.yml

  integration:
    uses: ./.github/workflows/integration.yml

  gate:
    name: CI
    needs: [contract, build, ginkgo, integration]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every native job
        shell: bash
        env:
          CONTRACT: ${{ needs.contract.result }}
          BUILD: ${{ needs.build.result }}
          GINKGO: ${{ needs.ginkgo.result }}
          INTEGRATION: ${{ needs.integration.result }}
        run: |
          test "$CONTRACT" = success
          test "$BUILD" = success
          test "$GINKGO" = success
          test "$INTEGRATION" = success
