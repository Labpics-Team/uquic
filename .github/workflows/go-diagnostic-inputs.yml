name: Pinned Go diagnostic inputs
on:
  push:
    branches: [docs/document-integrity-20260906]
permissions: {}
jobs:
  capture:
    if: github.actor == 'lemone112' && github.repository_id == '1270346127'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.24.13'
          cache: false
      - name: Fetch only public source and checksum-verified modules
        shell: bash
        run: |
          set -euo pipefail
          git -c core.hooksPath=/dev/null clone --no-checkout https://github.com/Labpics-Team/uquic.git "$RUNNER_TEMP/source"
          cd "$RUNNER_TEMP/source"
          git -c core.hooksPath=/dev/null checkout --detach 0739ded1142c2c5ac8c4a0488525e322d08d7301
          test "$(git rev-parse HEAD)" = 0739ded1142c2c5ac8c4a0488525e322d08d7301
          export GOMODCACHE="$RUNNER_TEMP/modules"
          go mod download
          go mod verify
          git diff --exit-code -- go.mod go.sum
          mkdir "$RUNNER_TEMP/inputs"
          go version > "$RUNNER_TEMP/inputs/identity"
          git rev-parse HEAD HEAD^{tree} >> "$RUNNER_TEMP/inputs/identity"
          tar -C "$(go env GOROOT)" -czf "$RUNNER_TEMP/inputs/go.tar.gz" .
          tar -C "$GOMODCACHE" -czf "$RUNNER_TEMP/inputs/modules.tar.gz" .
          cd "$RUNNER_TEMP/inputs"
          sha256sum *.tar.gz identity > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pinned-go-inputs-${{ github.sha }}
          path: ${{ runner.temp }}/inputs/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
