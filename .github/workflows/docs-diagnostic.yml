name: Documentation source snapshot
on:
  push:
    branches: [docs/document-integrity-20260906]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.event_name == 'push' && github.actor == 'lemone112' && github.repository_id == '1270346127'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git bundle create "$RUNNER_TEMP/uquic.bundle" HEAD
          git bundle verify "$RUNNER_TEMP/uquic.bundle"
          cd "$RUNNER_TEMP"
          sha256sum uquic.bundle > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: documentation-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/uquic.bundle
            ${{ runner.temp }}/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
